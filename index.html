<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>حاسبة أقصى مبلغ للقرض الشخصي</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Tahoma, sans-serif;
      background: #f2f5f9;
      color: #222;
    }

    .container {
      width: 100%;
      max-width: 500px;
      margin: 30px auto;
      padding: 15px;
    }

    .calculator {
      background: white;
      border-radius: 20px;
      padding: 25px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.08);
    }

    h1 {
      text-align: center;
      margin-top: 0;
      color: #1f4e79;
      font-size: 26px;
    }

    .description {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }

    .step {
      display: none;
    }

    .step.active {
      display: block;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
    }

    input, select {
      width: 100%;
      padding: 14px;
      margin-bottom: 18px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
      direction: rtl;
      background: white;
    }

    input:focus, select:focus {
      outline: none;
      border-color: #1f4e79;
    }

    .radio-group {
      margin-bottom: 18px;
    }

    .radio-option {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 10px;
      margin-bottom: 10px;
      cursor: pointer;
    }

    .radio-option input {
      width: auto;
      margin: 0;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #1f4e79;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 10px;
    }

    button:hover {
      background: #163a5c;
    }

    .btn-secondary {
      background: #ddd;
      color: #222;
    }

    .btn-secondary:hover {
      background: #ccc;
    }

    .result {
      display: none;
      margin-top: 25px;
      padding: 20px;
      background: #eef6ff;
      border-radius: 12px;
    }

    .result h2 {
      margin-top: 0;
      text-align: center;
      color: #1f4e79;
    }

    .result-row {
      display: flex;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px solid #d8e5f2;
    }

    .result-row:last-child {
      border-bottom: none;
    }

    .amount {
      font-weight: bold;
      color: #1f4e79;
    }
