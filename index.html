<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>حاسبة أقصى مبلغ للقرض الشخصي</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Tahoma, sans-serif;
      background: #f2f5f9;
      color: #222;
    }

    .container {
      width: 100%;
      max-width: 500px;
      margin: 30px auto;
      padding: 15px;
    }

    .calculator {
      background: white;
      border-radius: 20px;
      padding: 25px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.08);
    }

    h1 {
      text-align: center;
      margin-top: 0;
      color: #1f4e79;
      font-size: 28px;
    }

    .description {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 18px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
      direction: rtl;
    }

    input:focus {
      outline: none;
      border-color: #1f4e79;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #1f4e79;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #163a5c;
    }

    .result {
      display: none;
      margin-top: 25px;
      padding: 20px;
      background: #eef6ff;
      border-radius: 12px;
    }

    .result h2 {
      margin-top: 0;
      text-align: center;
      color: #1f4e79;
    }

    .result-row {
      display: flex;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px solid #d8e5f2;
    }

    .result-row:last-child {
      border-bottom: none;
    }

    .amount {
      font-weight: bold;
      color: #1f4e79;
    }

    .note {
      text-align: center;
      margin-top: 20px;
      color: #777;
      font-size: 13px;
    }

    @media (max-width: 600px) {
      .container {
        margin: 10px auto;
        padding: 10px;
      }

      .calculator {
        padding: 20px;
      }

      h1 {
        font-size: 24px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="calculator">

      <h1>حاسبة أقصى مبلغ للقرض</h1>

      <p class="description">
        احسب أقصى مبلغ استحقاق للقرض الشخصي بناءً على راتبك
      </p>

      <label for="salary">الراتب الشهري (بالريال/العملة)</label>
      <input
        type="number"
        id="salary"
        placeholder="مثال: 10000"
        min="0"
      >

      <label for="multiplier">مضاعف الراتب (عدد الأجور المسموحة عادة 18 إلى 22 راتب)</label>
      <input
        type="number"
        id="multiplier"
        placeholder="مثال: 18"
        value="18"
        min="1"
      >

      <label for="deductions">إجمالي القروض/الالتزامات الحالية (إن وجدت)</label>
      <input
        type="number"
        id="deductions"
        placeholder="مثال: 0"
        value="0"
        min="0"
      >

      <label for="maxDeductionRatio">أقصى نسبة استقطاع شهري مسموحة (%)</label>
      <input
        type="number"
        id="maxDeductionRatio"
        placeholder="مثال: 33.33"
        value="33.33"
        step="0.01"
      >

      <button onclick="calculateMaxLoan()">
        احسب الحد الأقصى للقرض
      </button>

      <div class="result" id="result">

        <h2>النتيجة التقديرية</h2>

        <div class="result-row">
          <span>أقصى قسط شهري مسموح:</span>
          <span class="amount" id="maxMonthlyDeduction">0</span>
        </div>

        <div class="result-row">
          <span>الحد الأقصى التقديري للقرض:</span>
          <span class="amount" id="maxLoanAmount">0</span>
        </div>

      </div>

      <div class="note">
        * هذه الحسبة تقريبية وتعتمد على السياسة الائتمانية الرسمية لدى البنك.
      </div>

    </div>

  </div>

  <script>

    function formatNumber(number) {
      return new Intl.NumberFormat('ar-SA', {
        minimumFractionDigits: 0,
        maximumFractionDigits: 2
      }).format(number);
    }

    function calculateMaxLoan() {

      const salary = parseFloat(document.getElementById("salary").value);
      const multiplier = parseFloat(document.getElementById("multiplier").value) || 18;
      const deductions = parseFloat(document.getElementById("deductions").value) || 0;
      const maxDeductionRatio = parseFloat(document.getElementById("maxDeductionRatio").value) || 33.33;

      if (isNaN(salary) || salary <= 0) {
        alert("يرجى إدخال الراتب بشكل صحيح.");
        return;
      }

      // حساب القسط الشهري الأقصى المسموح (الراتب * نسبة الاستقطاع)
      const maxMonthlyPayment = (salary * (maxDeductionRatio / 100));

      // حساب الحد الأقصى للمبلغ (الراتب * مضاعف الراتب - التزامات حالية)
      let maxLoan = (salary * multiplier) - deductions;

      if (maxLoan < 0) {
        maxLoan = 0;
      }

      document.getElementById("maxMonthlyDeduction").textContent = formatNumber(maxMonthlyPayment);
      document.getElementById("maxLoanAmount").textContent = formatNumber(maxLoan);

      document.getElementById("result").style.display = "block";
    }

  </script>

</body>
</html>
